name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APKs (debug + release)
        run: ./gradlew assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EmojiLabeler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EmojiLabeler-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          body: |
            EmojiLabeler 表情包标注 App

            ## 安装包
            - `app-release.apk`：正式版（已签名，可直接安装）
            - `app-debug.apk`：调试版（日志更详细）

            ## 功能
            - 导入（复制/原地两种模式，支持 GIF）
            - 快速标注 emoji + 自动下一张 + 多标模式
            - 自定义 emoji 集合、图片背景色
            - 导出 emoji 目录结构 + labels.json / stats.json
            - 复查改标、清空数据